name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Syntax + Import + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned to 3.11 because Python 3.12's stricter asyncio
          # task lifecycle interacts badly with coverage's tracer
          # over our 2,300-test suite — leaked "Task was destroyed
          # but it is pending!" messages corrupt the SQLAlchemy
          # session state for subsequent tests, manifesting as a
          # flaky `test_unlock_404_when_no_report` SETUP failure
          # (the seeded test-store row goes missing). Even with
          # coverage's `--concurrency=thread` flag the leak is
          # only reduced, not eliminated, because the underlying
          # cause is bare FastAPI TestClient instances spread
          # across many test files (~189 call sites).
          # Refactoring those is a separate cleanup PR; in the
          # meantime 3.11 keeps CI green.
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Compile check (catches syntax/indentation errors)
        run: python -m compileall -q .

      - name: Import smoke test (catches runtime import errors)
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret"
          STRIPE_SECRET_KEY: "sk_test_ci"
          STRIPE_BASIC_PRICE_ID: "price_basic_ci"
          STRIPE_PRO_PRICE_ID: "price_pro_ci"
          STRIPE_WEBHOOK_SECRET: "whsec_ci"
        run: python -c "import app; print('import OK')"

      - name: Run tests with coverage
        # --source=app,api covers BOTH the legacy Flask monolith and
        # the FastAPI modules under api/Modules/. Before this change
        # api/* was invisible to the coverage gate — new modules
        # could ship at 0% and CI was happy.
        #
        # --fail-under=80 reflects the broader scope: app.py sits
        # around 78% and the api/ tree is in the 95% range, so a
        # healthy total lands near 90%. 80 gives a ~10pt margin
        # before alerting; raise this by 5pt each time we clear a
        # sustained ~5pt buffer so new code is incentivized to
        # carry its own tests.
        #
        # tests/smoke/ excluded here — that layer needs Playwright +
        # a real browser and runs in the dedicated step below.
        # --tb=short -rfE surfaces the first failing test name +
        # short traceback in the GitHub Actions log so we can debug
        # without downloading raw artifacts.
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret"
          STRIPE_SECRET_KEY: "sk_test_ci"
          STRIPE_BASIC_PRICE_ID: "price_basic_ci"
          STRIPE_PRO_PRICE_ID: "price_pro_ci"
          STRIPE_WEBHOOK_SECRET: "whsec_ci"
        run: |
          coverage run --source=app,api -m pytest --tb=short -rfE --ignore=tests/smoke
          coverage report --fail-under=80

      # ── Browser smoke layer ───────────────────────────────────
      # Catches silent JS errors in the page chrome — the gap that
      # let PR #197 (owner avatar dropdown) and PR #198 (return-check
      # +Payment button) ship. Runs after the unit suite; if the unit
      # suite fails first we don't pay the Chromium-download cost.
      #
      # Marked `continue-on-error: true` so a flaky Playwright install
      # / browser-launch issue doesn't gate the unit suite. The smoke
      # layer is a high-value signal but the unit suite is the
      # ground-truth CI gate. When smoke is reliably passing for a
      # week, drop continue-on-error.
      #
      # `set -x` echoes commands so the failing line is obvious in the
      # raw log; `set -e` ensures the first non-zero exit propagates.
      - name: Install Playwright browser
        continue-on-error: true
        run: |
          set -ex
          pip install -r requirements-smoke.txt
          playwright --version
          which playwright
          playwright install chromium

      - name: Run browser smoke tests
        continue-on-error: true
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret"
          STRIPE_SECRET_KEY: "sk_test_ci"
          STRIPE_BASIC_PRICE_ID: "price_basic_ci"
          STRIPE_PRO_PRICE_ID: "price_pro_ci"
          STRIPE_WEBHOOK_SECRET: "whsec_ci"
        # `-v --tb=short` makes any failure self-diagnosing; `-rA`
        # shows skip/xfail summaries so an unintended import-skip
        # doesn't quietly mask a regression.
        run: pytest tests/smoke/ -v --tb=short -rA
