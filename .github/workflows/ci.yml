name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Syntax + Import + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Compile check (catches syntax/indentation errors)
        run: python -m compileall -q .

      - name: Import smoke test (catches runtime import errors)
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret"
          STRIPE_SECRET_KEY: "sk_test_ci"
          STRIPE_BASIC_PRICE_ID: "price_basic_ci"
          STRIPE_PRO_PRICE_ID: "price_pro_ci"
          STRIPE_WEBHOOK_SECRET: "whsec_ci"
        run: python -c "import app; print('import OK')"

      - name: Run tests with coverage
        # --fail-under is our regression guard against coverage drops. Current
        # floor is 60 (we sit around 62); raise it each time we clear
        # a ~5pt margin so new code is incentivized to carry its own tests.
        # tests/smoke/ excluded here — that layer needs Playwright + a
        # real browser and runs in the dedicated step below.
        #
        # `--concurrency=thread` is required on Python 3.12: without it,
        # coverage's tracer interacts badly with FastAPI/asyncio task
        # cleanup and leaks `Task was destroyed but it is pending!`
        # errors that corrupt the SQLAlchemy seed-fixture state for the
        # next test (manifests as `test_unlock_404_when_no_report` failing
        # at SETUP because the seeded test-store row goes missing).
        # Verified locally: passes on 3.12 with the flag, errors without it.
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret"
          STRIPE_SECRET_KEY: "sk_test_ci"
          STRIPE_BASIC_PRICE_ID: "price_basic_ci"
          STRIPE_PRO_PRICE_ID: "price_pro_ci"
          STRIPE_WEBHOOK_SECRET: "whsec_ci"
        run: |
          coverage run --source=app --concurrency=thread -m pytest -q --ignore=tests/smoke
          coverage report --fail-under=60

      # ── Browser smoke layer ───────────────────────────────────
      # Catches silent JS errors in the page chrome — the gap that
      # let PR #197 (owner avatar dropdown) and PR #198 (return-check
      # +Payment button) ship. Runs after the unit suite; if the unit
      # suite fails first we don't pay the Chromium-download cost.
      #
      # Marked `continue-on-error: true` so a flaky Playwright install
      # / browser-launch issue doesn't gate the unit suite. The smoke
      # layer is a high-value signal but the unit suite is the
      # ground-truth CI gate. When smoke is reliably passing for a
      # week, drop continue-on-error.
      #
      # `set -x` echoes commands so the failing line is obvious in the
      # raw log; `set -e` ensures the first non-zero exit propagates.
      - name: Install Playwright browser
        continue-on-error: true
        run: |
          set -ex
          pip install -r requirements-smoke.txt
          playwright --version
          which playwright
          playwright install chromium

      - name: Run browser smoke tests
        continue-on-error: true
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret"
          STRIPE_SECRET_KEY: "sk_test_ci"
          STRIPE_BASIC_PRICE_ID: "price_basic_ci"
          STRIPE_PRO_PRICE_ID: "price_pro_ci"
          STRIPE_WEBHOOK_SECRET: "whsec_ci"
        # `-v --tb=short` makes any failure self-diagnosing; `-rA`
        # shows skip/xfail summaries so an unintended import-skip
        # doesn't quietly mask a regression.
        run: pytest tests/smoke/ -v --tb=short -rA
