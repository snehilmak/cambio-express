name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Syntax + Import + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned to 3.11. The leaked-TestClient pathology that
          # originally forced this pin was fixed in PR #555 (every
          # bare ``TestClient(api_app)`` site migrated to a
          # ``yield``-managed fixture; the conftest's autoclose
          # monkey-patch deleted). 3.12 has not been validated end-
          # to-end yet — bumping deserves its own PR.
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Compile check (catches syntax/indentation errors)
        run: python -m compileall -q .

      - name: Import smoke test (catches runtime import errors)
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret"
          STRIPE_SECRET_KEY: "sk_test_ci"
          STRIPE_BASIC_PRICE_ID: "price_basic_ci"
          STRIPE_PRO_PRICE_ID: "price_pro_ci"
          STRIPE_WEBHOOK_SECRET: "whsec_ci"
          DINEROBOOK_SKIP_INIT_DB: "1"
        run: python -c "import asgi; print('import OK')"

      - name: Run tests with coverage
        # --source=api covers the FastAPI tree. PR #550 (kill Flask)
        # removed the legacy ``app.py`` monolith; ``api/Modules/`` is
        # the entirety of production code now.
        #
        # --fail-under=80 reflects the broader scope across api/.
        # Raise this by 5pt each time we clear a sustained ~5pt
        # buffer so new code is incentivized to carry its own tests.
        #
        # tests/smoke/ excluded here — that layer needs Playwright +
        # a real browser and runs in the dedicated step below.
        # --tb=short -rfE surfaces the first failing test name +
        # short traceback in the GitHub Actions log so we can debug
        # without downloading raw artifacts.
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret"
          STRIPE_SECRET_KEY: "sk_test_ci"
          STRIPE_BASIC_PRICE_ID: "price_basic_ci"
          STRIPE_PRO_PRICE_ID: "price_pro_ci"
          STRIPE_WEBHOOK_SECRET: "whsec_ci"
        run: |
          coverage run --source=api -m pytest --tb=short -rfE --ignore=tests/smoke
          coverage report --fail-under=80

      # ── mypy strict on the ratchet subset ─────────────────────
      # E5 (BACKLOG.md).  ``pyproject.toml`` enumerates the files
      # currently held to ``--strict``; the rest of the tree is
      # checked permissively (or not at all).  New files are added
      # to the ratchet as each module gets cleaned up — this step
      # exists so a regression on the already-clean subset can't
      # land silently.
      - name: Type check (mypy strict ratchet)
        run: python -m mypy

      # ── SPA build + lint gate ─────────────────────────────────
      # Catches TS regressions and eslint violations before they
      # ship. The SPA is served as static assets out of
      # frontend/dist/ — when the build silently breaks, every
      # /app/* route returns a 503 fallback (we hit this multiple
      # times during the SPA migration). Build here so a broken
      # bundle is a red CI light, not a production discovery.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend (eslint --max-warnings 0)
        working-directory: frontend
        # `--max-warnings 0` makes ANY warning a CI failure. eslint
        # config currently has 0 errors + 0 warnings on main; new
        # rules added later default to error severity and need to
        # be cleaned up before they reach this gate.
        run: npm run lint -- --max-warnings 0

      - name: Build frontend (tsc + vite)
        working-directory: frontend
        run: npm run build

      # ── Browser smoke layer ───────────────────────────────────
      # Catches silent JS errors in the page chrome — the gap that
      # let PR #197 (owner avatar dropdown) and PR #198 (return-check
      # +Payment button) ship. Runs after the unit suite; if the unit
      # suite fails first we don't pay the Chromium-download cost.
      #
      # Marked `continue-on-error: true` so a flaky Playwright install
      # / browser-launch issue doesn't gate the unit suite. The smoke
      # layer is a high-value signal but the unit suite is the
      # ground-truth CI gate. When smoke is reliably passing for a
      # week, drop continue-on-error.
      #
      # `set -x` echoes commands so the failing line is obvious in the
      # raw log; `set -e` ensures the first non-zero exit propagates.
      - name: Install Playwright browser
        continue-on-error: true
        # ``--with-deps`` lets Playwright apt-install the OS libraries
        # (libnss3, libatk-1.0-0, libxkbcommon0, libgbm1, libasound2t64,
        # etc.) that Chromium needs at launch time. Without this the
        # ``playwright install chromium`` step downloads the binary
        # successfully but the first Chromium spawn in
        # ``smoke_server`` fails with a cryptic shared-library error,
        # which is what was masking this slot earlier.
        #
        # Diagnostics: print python + playwright + apt versions on
        # every run so the next failure (if any) is self-diagnosing
        # from the raw log without having to add ``set -x`` later.
        run: |
          set -ex
          python --version
          pip --version
          pip install -r requirements-smoke.txt
          playwright --version
          which playwright
          playwright install --with-deps chromium

      - name: Run browser smoke tests
        continue-on-error: true
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-secret"
          STRIPE_SECRET_KEY: "sk_test_ci"
          STRIPE_BASIC_PRICE_ID: "price_basic_ci"
          STRIPE_PRO_PRICE_ID: "price_pro_ci"
          STRIPE_WEBHOOK_SECRET: "whsec_ci"
        # `-v --tb=short` makes any failure self-diagnosing; `-rA`
        # shows skip/xfail summaries so an unintended import-skip
        # doesn't quietly mask a regression.
        run: pytest tests/smoke/ -v --tb=short -rA
