<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA: links the manifest + theme color so the SPA can be
         installed as a standalone app on Chrome / Edge / Safari.
         The service worker registers from src/lib/installPrompt.ts
         once the app boots. -->
    <link rel="manifest" href="/static/manifest.webmanifest" />
    <meta name="theme-color" content="#0f1f3d" />
    <!--
      Design-system tokens (colors, fonts, spacing) live in
      /static/design-tokens.css. Both [data-theme="dark"] and
      [data-theme="light"] are defined there; the inline script
      below restores the user's saved theme before the React
      bundle paints so we don't flash dark-on-light or vice versa.
    -->
    <link rel="stylesheet" href="/static/design-tokens.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />
    <script>
      // Restore the saved theme before first paint. The full
      // toggle (with server-side persistence on User.theme_preference)
      // lives in frontend/src/lib/theme.ts — this snippet only
      // reads the cached localStorage value so the chrome doesn't
      // flash on reload. Falls back to dark on missing / corrupt.
      (function () {
        try {
          var t = window.localStorage.getItem("dinerobook.theme");
          if (t === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (_e) {
          /* localStorage blocked — stay on dark */
        }
      })();
    </script>
    <title>DineroBook — Bookkeeping for money-service businesses</title>
    <meta name="description" content="DineroBook is the all-in-one bookkeeping platform for money-service businesses: daily cash ledger, monthly P&amp;L, multi-store management, and built-in compliance reporting." />

    <!-- Open Graph / link previews (Slack, iMessage, Twitter, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DineroBook" />
    <meta property="og:title" content="DineroBook — Bookkeeping for money-service businesses" />
    <meta property="og:description" content="Daily cash ledger, monthly P&amp;L, multi-store management, and built-in compliance reporting for MSBs." />
    <meta property="og:url" content="https://dinerobook.com" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DineroBook" />
    <meta name="twitter:description" content="Bookkeeping for money-service businesses." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
