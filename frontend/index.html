<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Single source of truth for design tokens lives in Flask's
      static/design-tokens.css (CLAUDE.md "Design system" invariant).
      The SPA loads it directly so any token change propagates to
      both the legacy Jinja site and the new SPA without duplication.
    -->
    <link rel="stylesheet" href="/static/design-tokens.css" />
    <!--
      JetBrains Mono is referenced by `--db-font-mono` but the
      shared design-tokens.css only imports Space Grotesk + Inter.
      The legacy landing.html loads it inline; mirror that here so
      SPA pages that use the mono token render correctly.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />
    <title>DineroBook</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
