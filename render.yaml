services:
  - type: web
    name: dinerobook
    env: python
    # Build runs Python deps + installs Node via nodeenv +
    # builds the React/Vite SPA bundle that Flask serves at
    # /app/*. See scripts/build.sh for what each step does.
    buildCommand: bash ./scripts/build.sh
    # ASGI entrypoint via gunicorn's UvicornWorker. asgi.py routes
    # /api/v2/* directly to the FastAPI app at the ASGI layer,
    # bypassing the inner a2wsgi.ASGIMiddleware that the legacy
    # Flask DispatcherMiddleware chain set up. That bridge was
    # leaking asyncio tasks in its background thread, eventually
    # hanging the gunicorn worker on /api/v2/auth/login-cross-store
    # (incident: WORKER TIMEOUT → SIGKILL → "Network error" in the
    # SPA login screen). With the bypass, /api/v2 is served as
    # native ASGI and the leaky background loop is no longer in
    # the request path.
    startCommand: gunicorn asgi:asgi_app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dinerobook-db
          property: connectionString
      - key: SUPERADMIN_PASSWORD
        value: super2025!   # CHANGE THIS after first deploy
      - key: ADMIN_PASSWORD
        value: cambio2025!  # CHANGE THIS after first deploy
      - key: PYTHON_VERSION
        value: 3.11.0

      # ── Domain / WebAuthn ────────────────────────────────────
      # Production runs on the dinerobook.com custom domain.
      # WEBAUTHN_RP_ID pins the WebAuthn Relying Party ID — passkeys
      # are cryptographically bound to this string, so changing it
      # invalidates every existing passkey. Must match the page
      # origin's effective domain or be a registrable suffix of it.
      - key: WEBAUTHN_RP_ID
        value: dinerobook.com
      - key: APP_BASE_URL
        value: https://dinerobook.com

      # ── Stripe ───────────────────────────────────────────────
      # These are required for billing (subscribe + cancel) and for the
      # new bank-sync flow via Stripe Financial Connections.
      # `sync: false` means Render does NOT use a value from this file —
      # instead it prompts you to enter the secret in the dashboard.
      # Where to find each value:
      #   STRIPE_SECRET_KEY  → Stripe → Developers → API keys → Secret key
      #                         (starts with sk_test_ in test mode, sk_live_ in live)
      #   STRIPE_WEBHOOK_SECRET → Stripe → Developers → Webhooks → your
      #                         endpoint → "Signing secret" (starts whsec_)
      #   STRIPE_BASIC_PRICE_ID / STRIPE_PRO_PRICE_ID → Stripe → Products →
      #                         your plan → Pricing → copy the price ID
      #                         (starts price_)
      #   STRIPE_BASIC_YEARLY_PRICE_ID / STRIPE_PRO_YEARLY_PRICE_ID →
      #                         Stripe → Products → Basic or Pro → add an
      #                         additional price with yearly recurring →
      #                         copy the price ID. Optional: leave blank
      #                         to hide the yearly button on /subscribe.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_BASIC_PRICE_ID
        sync: false
      - key: STRIPE_BASIC_YEARLY_PRICE_ID
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_PRO_YEARLY_PRICE_ID
        sync: false
      # STRIPE_PUBLISHABLE_KEY → Stripe → Developers → API keys →
      # Publishable key (starts with pk_test_ or pk_live_). Required by
      # the bank-connect page so Stripe.js can open the Financial
      # Connections modal client-side. Pair with STRIPE_SECRET_KEY:
      # pk_test_ goes with sk_test_ and pk_live_ with sk_live_.
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false

      # ── SMTP for password reset emails ───────────────────────
      # Until these are set, /forgot-password still works — it just logs
      # the reset URL at WARNING level instead of emailing. Gmail + app
      # password is the quickest option:
      #   SMTP_HOST = smtp.gmail.com
      #   SMTP_PORT = 587
      #   SMTP_USER = dinerobook26@gmail.com
      #   SMTP_PASS = <16-char Google App Password, NOT your login>
      #   SMTP_FROM = dinerobook26@gmail.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  # ── Data-retention purge (BACKLOG "Before going live") ───
  # Render Cron Job that runs once a day at 03:15 UTC and deletes
  # Store rows past their 180-day data_retention_until deadline.
  # The Flask CLI `purge-expired-stores` is idempotent — re-running
  # on a day with nothing to delete is a no-op. Cascades through
  # _STORE_OWNED_MODELS before deleting the Store row; per
  # CLAUDE.md invariant #4, never add a per-store model without
  # adding it to that list or the purge silently leaks data.
  - type: cron
    name: dinerobook-data-retention-purge
    runtime: python
    # Render deprecated free-tier cron jobs in 2026 ("free not a
    # valid plan for service type cron" in Blueprint sync). Cheapest
    # paid tier — the purge runs once a day, so the cost is minimal.
    plan: starter
    buildCommand: pip install -r requirements.txt
    # 03:15 UTC daily — off-peak for every operator timezone.
    schedule: "15 3 * * *"
    # Standalone Python script (see scripts/purge_expired_stores.py).
    # Replaced the legacy `flask purge-expired-stores` invocation
    # which booted the whole Flask app to run a single Service call.
    # The standalone form only imports api/Core + api/Modules/Billing,
    # so cron startup is faster and doesn't depend on Flask.
    startCommand: python -m scripts.purge_expired_stores
    envVars:
      # Reuse the same database the web service writes to.
      - key: DATABASE_URL
        fromDatabase:
          name: dinerobook-db
          property: connectionString
      # The standalone script reads `settings.database_url` directly
      # via api/Core/Config — it does NOT boot the Flask app or
      # touch SECRET_KEY / APP_BASE_URL. The web service still mirrors
      # those values for itself; this cron just needs the database.
      - key: PYTHON_VERSION
        value: 3.11.0

  # ── Background-job worker (BACKLOG D5) ─────────────────────
  # Drains the RQ queue at ``api/Core/Jobs.py``. Currently
  # commented out — the worker fails to start when ``REDIS_URL``
  # isn't set, and we don't have a managed Redis instance
  # provisioned on Render yet.
  #
  # Activation sequence (one-time, ~15 min):
  #
  # 1. Provision Redis. Either:
  #    - Render's managed Redis (cheapest paid tier ~$7/mo), or
  #    - Upstash (free tier sufficient for this workload).
  #    Copy the connection URL.
  #
  # 2. In the Render dashboard, on BOTH the ``dinerobook`` web
  #    service AND the (about-to-be-uncommented) worker service:
  #    - Add ``REDIS_URL`` env var → the connection URL from step 1
  #    - Add ``JOB_QUEUE_ENABLED`` env var → ``1``
  #    Without both, the wrapper falls back to sync execution.
  #
  # 3. Uncomment the worker block below + the worker env-var
  #    mirrors + sync the blueprint. Render brings the worker up.
  #
  # 4. Watch the worker logs for the first job. The
  #    ``/forgot-password`` flow is the canonical test —
  #    submitting it enqueues a ``send_password_reset_email``
  #    job that the worker should pick up within ~1s.
  #
  # The worker service mirrors every env var the web service
  # needs because the worker runs the SAME functions (e.g. the
  # SMTP-send function reads ``SMTP_HOST`` etc.). Keep these in
  # sync — when a new env var is added to the web service,
  # mirror it here too.
  #
  # - type: worker
  #   name: dinerobook-worker
  #   runtime: python
  #   plan: starter
  #   buildCommand: pip install -r requirements.txt
  #   startCommand: rq worker --url $REDIS_URL default
  #   envVars:
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: dinerobook-db
  #         property: connectionString
  #     - key: REDIS_URL
  #       sync: false
  #     - key: JOB_QUEUE_ENABLED
  #       value: "1"
  #     - key: SECRET_KEY
  #       sync: false
  #     - key: APP_BASE_URL
  #       value: https://dinerobook.com
  #     - key: SMTP_HOST
  #       sync: false
  #     - key: SMTP_PORT
  #       value: "587"
  #     - key: SMTP_USER
  #       sync: false
  #     - key: SMTP_PASS
  #       sync: false
  #     - key: SMTP_FROM
  #       sync: false
  #     - key: STRIPE_SECRET_KEY
  #       sync: false
  #     - key: STRIPE_WEBHOOK_SECRET
  #       sync: false
  #     - key: PYTHON_VERSION
  #       value: 3.11.0

databases:
  - name: dinerobook-db
    plan: free          # upgrade to starter ($7/mo) for production
    databaseName: dinerobook
    user: dinerobook
