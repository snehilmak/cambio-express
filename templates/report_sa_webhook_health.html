{% extends "_report_page.html" %}

{% block report_rows %}
{% if not rows %}
<div class="report-empty">No Stripe webhook deliveries logged in this period.</div>
{% endif %}

{% for r in rows %}
<div class="report-card report-card--compact">
  <div class="report-card__head">
    <div class="report-card__name">{{ r.status }}</div>
    <div class="report-card__count mono"
         style="color: {% if r.status_key == 'ok' %}var(--db-neon){% elif r.status_key == 'signature_err' %}var(--db-negative){% else %}var(--db-warning){% endif %};">
      {{ r.count }}
    </div>
  </div>
</div>
{% endfor %}
{% endblock %}
