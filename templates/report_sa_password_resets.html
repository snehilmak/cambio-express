{% extends "_report_page.html" %}

{% block report_rows %}
{% if not rows %}
<div class="report-empty">No password-reset activity in this period.</div>
{% endif %}

{% for r in rows %}
<div class="report-card report-card--compact">
  <div class="report-card__head">
    <div>
      <div class="report-card__name">{{ r.username }}</div>
      <div class="report-card__sub mono">{{ r.role }} · {{ r.created_at.strftime('%Y-%m-%d %H:%M') if r.created_at else '—' }}</div>
    </div>
    <div class="report-card__count mono"
         style="color: {% if r.status == 'Used' %}var(--db-neon){% elif r.status == 'Expired' %}var(--db-gray-7){% else %}var(--db-warning){% endif %};">
      {{ r.status }}
    </div>
  </div>
</div>
{% endfor %}
{% endblock %}
