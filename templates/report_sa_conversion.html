{% extends "_report_page.html" %}

{% block report_rows %}
{% if not rows or totals.total == 0 %}
<div class="report-empty">No signups in this period.</div>
{% endif %}

{% for r in rows %}
<div class="report-card report-card--compact">
  <div class="report-card__head">
    <div class="report-card__name">{{ r.label }}</div>
    <div class="report-card__count mono">{{ r.count }}</div>
  </div>
</div>
{% endfor %}
{% endblock %}
