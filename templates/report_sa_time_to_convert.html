{% extends "_report_page.html" %}

{% block report_rows %}
{% if not rows %}
<div class="report-empty">No paid stores signed up in this period.</div>
{% endif %}

{% for r in rows %}
<div class="report-card">
  <div class="report-card__head">
    <div>
      <div class="report-card__name">{{ r.name }}</div>
      <div class="report-card__sub mono">{{ r.slug }} · {{ r.plan }} · signed up {{ r.signed_up.strftime('%b %d, %Y') }}</div>
    </div>
    <div class="report-card__count mono">{{ r.days }}<span class="report-card__count-suffix"> days</span></div>
  </div>
</div>
{% endfor %}
{% endblock %}
