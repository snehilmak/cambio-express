{% extends "_report_page.html" %}

{% block report_rows %}
{% if not rows %}
<div class="report-empty">No data in this period.</div>
{% endif %}

{% for r in rows %}
<div class="report-card">
  <div class="report-card__head">
    <div class="report-card__name">{{ r.plan }}</div>
    <div class="report-card__count mono"
         style="color: {% if r.rate_pct >= 70 %}var(--db-neon){% elif r.rate_pct >= 30 %}var(--db-warning){% else %}var(--db-negative){% endif %};">
      {{ '{:.1f}'.format(r.rate_pct) }}%
    </div>
  </div>
  <div class="report-card__metrics">
    <div class="report-card__metric">
      <div class="report-card__metric-label">Connected</div>
      <div class="report-card__metric-value mono">{{ r.connected }}</div>
    </div>
    <div class="report-card__metric">
      <div class="report-card__metric-label">Total Stores</div>
      <div class="report-card__metric-value mono">{{ r.total }}</div>
    </div>
  </div>
</div>
{% endfor %}
{% endblock %}
