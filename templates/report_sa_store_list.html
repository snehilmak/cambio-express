{% extends "_report_page.html" %}

{% block report_rows %}
{% if not rows %}
<div class="report-empty">No matching stores.</div>
{% endif %}

{% for r in rows %}
<div class="report-card report-card--compact">
  <div class="report-card__head">
    <div>
      <div class="report-card__name">{{ r.name }}</div>
      <div class="report-card__sub mono">{{ r.slug }}{% if r.plan %} · {{ r.plan }}{% endif %}{% if r.reason %} · {{ r.reason }}{% endif %}</div>
    </div>
  </div>
</div>
{% endfor %}
{% endblock %}
